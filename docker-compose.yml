# StackPulse Docker Compose
# Development and Production configurations

services:
  # ===================
  # Frontend Service
  # ===================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: ${TARGET:-dev}
      args:
        - NEXT_PUBLIC_SERVER_URL=${NEXT_PUBLIC_SERVER_URL:-http://server:3001}
        - NEXT_PUBLIC_HIRO_API_KEY=${NEXT_PUBLIC_HIRO_API_KEY}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NEXT_PUBLIC_SERVER_URL=${NEXT_PUBLIC_SERVER_URL:-http://server:3001}
    volumes:
      - ./frontend:/app:delegated
      - /app/node_modules
      - /app/.next
    depends_on:
      - server
    networks:
      - stackpulse-network
    restart: unless-stopped

  # ===================
  # Server Service
  # ===================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: ${TARGET:-dev}
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3001
      - CHAINHOOK_API_TOKEN=${CHAINHOOK_API_TOKEN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - EMAIL_SERVICE_API_KEY=${EMAIL_SERVICE_API_KEY}
      - HIRO_API_KEY=${HIRO_API_KEY}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    volumes:
      - ./server:/app:delegated
      - /app/node_modules
      - server-data:/app/data
      - server-logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - stackpulse-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ===================
  # Redis Cache
  # ===================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - stackpulse-network
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ===================
  # Nginx Reverse Proxy (Production)
  # ===================
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - server
    networks:
      - stackpulse-network
    restart: unless-stopped
    profiles:
      - production

# ===================
# Networks
# ===================
networks:
  stackpulse-network:
    driver: bridge

# ===================
# Volumes
# ===================
volumes:
  server-data:
    driver: local
  server-logs:
    driver: local
  redis-data:
    driver: local
