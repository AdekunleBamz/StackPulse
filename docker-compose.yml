version: '3.8'

services:
  # StackPulse API Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: stackpulse-server
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - CHAINHOOKS_API_KEY=${CHAINHOOKS_API_KEY}
      - CHAINHOOK_AUTH_TOKEN=${CHAINHOOK_AUTH_TOKEN}
      - DEPLOYER_ADDRESS=${DEPLOYER_ADDRESS}
      - LOG_LEVEL=debug
    volumes:
      - ./server/src:/app/src
      - server-data:/app/data
      - server-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - stackpulse-network

  # Frontend Next.js App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stackpulse-frontend
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_SERVER_URL=http://server:3000
      - NEXT_PUBLIC_DEPLOYER_ADDRESS=${DEPLOYER_ADDRESS}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - stackpulse-network

  # Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: stackpulse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - stackpulse-network
    command: redis-server --appendonly yes

  # Nginx reverse proxy (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: stackpulse-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
      - frontend
    restart: unless-stopped
    networks:
      - stackpulse-network

volumes:
  server-data:
  server-logs:
  redis-data:

networks:
  stackpulse-network:
    driver: bridge
